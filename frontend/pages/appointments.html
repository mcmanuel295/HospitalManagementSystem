<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Appointments - Hospital Management</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><h2>Nurture</h2></div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="patients.html">Patients</a>
        <a href="doctors.html">Doctors</a>
        <a class="active" href="appointments.html">Appointments</a>
        <a href="pharmacy.html">Pharmacy</a>
      </nav>
      <a href="#" class="logout" onclick="logout()">Logout</a>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Appointment Management</h1>
        <button class="btn-primary">Book New Appointment</button>
      </header>

      <section class="panel">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Patient</th>
              <th>Doctor</th>
              <th>Time</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2024-01-15</td>
              <td>John Doe</td>
              <td>Dr. Smith</td>
              <td>09:30 AM</td>
              <td><span class="badge confirmed">Confirmed</span></td>
            </tr>
            <tr>
              <td>2024-01-15</td>
              <td>Mary James</td>
              <td>Dr. Lee</td>
              <td>10:15 AM</td>
              <td><span class="badge pending">Pending</span></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
