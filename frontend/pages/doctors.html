<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctors - Hospital Management</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><h2>Nurture</h2></div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="patients.html">Patients</a>
        <a class="active" href="doctors.html">Doctors</a>
        <a href="appointments.html">Appointments</a>
        <a href="pharmacy.html">Pharmacy</a>
      </nav>
      <a href="#" class="logout" onclick="logout()">Logout</a>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Doctor Management</h1>
        <button class="btn-primary">Add New Doctor</button>
      </header>

      <section class="panel">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Specialization</th>
              <th>Available</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>D001</td>
              <td>Dr. Smith</td>
              <td>Cardiology</td>
              <td>Yes</td>
              <td><span class="badge confirmed">Online</span></td>
            </tr>
            <tr>
              <td>D002</td>
              <td>Dr. Lee</td>
              <td>Neurology</td>
              <td>No</td>
              <td><span class="badge pending">Busy</span></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
