<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><h2>Nurture</h2></div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="patients.html">Patients</a>

              <td>P001</td>
              <td>John Doe</td>
              <td>35</td>
              <td>555-0101</td>
              <td><span class="badge confirmed">Active</span></td>
            </tr>
            <tr>
              <td>P002</td>
              <td>Jane Smith</td>
              <td>28</td>
              <td>555-0102</td>
              <td><span class="badge confirmed">Active</span></td>
